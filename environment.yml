name: llm-env
channels:
  - nvidia
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - numpy
  - pillow
  - scikit-learn
  - faiss-cpu
  - pip:
      - pymupdf             # fitz
      - transformers
      - langchain
      - langchain-community
      - ipykernel
  # PyTorch with CUDA 11.8
  - pytorch
  - torchvision
  - torchaudio
  - pytorch-cuda=11.8
